name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
      - name: Create CI environment
        run: cp .env.example .env
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Start PostgreSQL
        run: docker compose up -d --wait db mailcatcher
      - name: Migrate database
        working-directory: backend
        run: uv run bash scripts/prestart.sh
      - name: Test backend
        working-directory: backend
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun ci
      - run: bun run --filter frontend build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t full-stack-fastapi-backend:test .
      - name: Build frontend image
        run: >-
          docker build -f frontend/Dockerfile
          --build-arg VITE_API_URL=https://api-fast-fs.chenchangchao.com
          -t full-stack-fastapi-frontend:test .
